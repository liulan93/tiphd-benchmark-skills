# TiPhD Benchmark — 深度学习 Python 环境（conda）
# 环境名: tiphd-torch
# 用法: conda env create -f environment.yml
# 适用工具: SCAD / SIDISH / scDEAL / scSurv / scTREND（PyTorch 深度学习类）
# 自定义 Python 包（SIDISH / scTREND / scSurv）需从 third_party/python/ 安装
# 与 environment-tirank.yml (统计学习环境) 并存，不冲突。
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pytorch          # CPU 版
  - cpuonly
  - pip:
      - anndata
      - scanpy
